[project]
name = "idp-project"
version = "0.1.0"
description = "AI-Powered Document Processing Pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Backend
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Document Parsing
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    # Task Queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # LLM Integration
    "anthropic>=0.39.0",
    "ollama>=0.4.0",
    "tenacity>=9.0.0",
    # Auth & Utilities
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.18.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "passlib[bcrypt]>=1.7.4",
    # Object Storage
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
